name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Check focused lint baseline
        run: uv run ruff check --select E4,E7,E9,F app tests

      - name: Check new test files
        run: uv run ruff check tests/test_config.py tests/test_fixture_documents.py

      - name: Check new test formatting
        run: uv run ruff format --check tests/test_config.py tests/test_fixture_documents.py
